name: Publish npm package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        id: release
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:browser
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - run: pnpm test:anki
      - run: pnpm pack --pack-destination .tmp/release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .tmp/release/*.tgz
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Publish verified tarball
        run: npm publish package/*.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
      - name: Create GitHub release
        shell: bash
        run: |
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$DIST_TAG" == next ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
