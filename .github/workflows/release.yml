name: Publish npm package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check whether the version is already published
        id: release
        run: node scripts/check-release.mjs
  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Set the computed package version
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          pnpm install --lockfile-only --ignore-scripts
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:browser
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - run: pnpm test:anki
      - run: pnpm pack --pack-destination .tmp/release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .tmp/release/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
  publish:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
      - name: Record the verified version on main
        id: version-commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- package.json pnpm-lock.yaml; then
            git add package.json pnpm-lock.yaml
            git commit -m "chore: release $RELEASE_TAG"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Publish verified tarball
        run: npm publish ./package/*.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
      - name: Create GitHub release
        shell: bash
        run: |
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --generate-notes)
          if [[ "$DIST_TAG" == next ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version-commit.outputs.sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
