name: CI
on:
  push:
    branches: [main, feat/v5]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
      - run: npm install --global corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm demo:build
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:browser
      - run: pnpm test:anki
